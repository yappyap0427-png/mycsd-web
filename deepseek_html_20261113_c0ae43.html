<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<title>MyCSD · Upcoming</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #000000;
    --text-2: rgba(60,60,67,.6);
    --text-3: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.18);
    --fill: rgba(118,118,128,.12);
    --blue: #0a84ff;
    --red: #ff3b30;
    --orange: #ff9500;
    --green: #34c759;
    --nav-h: 44px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --card: #1c1c1e;
      --text: #ffffff;
      --text-2: rgba(235,235,245,.6);
      --text-3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.6);
      --fill: rgba(118,118,128,.24);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display",
      "Helvetica Neue", "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }
  body.locked { overflow: hidden; }

  .nav {
    position: sticky; top: 0; z-index: 30;
    height: calc(var(--nav-h) + env(safe-area-inset-top));
    padding-top: env(safe-area-inset-top);
    display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: .5px solid transparent;
    transition: border-color .2s;
  }
  .nav.scrolled { border-bottom-color: var(--sep); }
  .nav-title {
    font-size: 17px; font-weight: 600; letter-spacing: -.02em;
    opacity: 0; transform: translateY(4px);
    transition: opacity .2s, transform .2s;
  }
  .nav.scrolled .nav-title { opacity: 1; transform: none; }

  .wrap { width: min(680px, 100%); margin: 0 auto; padding: 0 16px; }

  .large-title {
    margin: 0; padding: 18px 4px 10px;
    font-size: 34px; font-weight: 700; letter-spacing: -.045em;
    line-height: 1.1;
  }
  .subtitle {
    margin: 0 4px 16px; color: var(--text-2);
    font-size: 15px; line-height: 1.5;
  }

  .segmented {
    position: relative; display: flex;
    background: var(--fill); border-radius: 10px; padding: 2px;
    margin: 0 0 18px;
  }
  .seg-thumb {
    position: absolute; top: 2px; bottom: 2px; left: 0;
    background: var(--card); border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), width .3s cubic-bezier(.2,.8,.2,1);
  }
  .seg {
    position: relative; flex: 1; z-index: 1;
    border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 7px 4px; border-radius: 8px; cursor: pointer;
    transition: color .2s;
  }
  .seg[aria-selected="true"] { font-weight: 600; }

  .day-group { margin-bottom: 26px; }
  .day-header {
    position: sticky;
    top: calc(var(--nav-h) + env(safe-area-inset-top));
    z-index: 10;
    margin: 0 0 8px; padding: 8px 4px;
    font-size: 13px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--text-2);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .day-header .today-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--blue); margin-right: 6px; vertical-align: 1px;
  }

  .card {
    position: relative;
    display: block; width: 100%; text-align: left;
    background: var(--card); border: 0; border-radius: 18px;
    padding: 16px 16px 15px; margin-bottom: 10px;
    font: inherit; color: var(--text);
    cursor: pointer; outline: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s cubic-bezier(.2,.8,.2,1);
    animation: rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.08); }
  .card:active { transform: scale(.982); }
  .card:focus-visible { box-shadow: 0 0 0 4px rgba(10,132,255,.3); }
  @media (prefers-color-scheme: dark) {
    .card { box-shadow: none; }
    .card:hover { box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  }

  .card-top {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; margin-bottom: 6px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 600; letter-spacing: -.01em;
    padding: 3px 8px; border-radius: 999px;
    background: var(--fill); color: var(--text-2);
  }
  .chip.today { background: rgba(255,59,48,.14); color: var(--red); }
  .chip.tomorrow { background: rgba(255,149,0,.16); color: var(--orange); }
  .chip.soon { background: rgba(10,132,255,.14); color: var(--blue); }
  .chip.closing { background: rgba(255,59,48,.14); color: var(--red); }

  .bell {
    flex: 0 0 auto;
    width: 32px; height: 32px; margin: -4px -6px 0 0;
    display: grid; place-items: center;
    border: 0; border-radius: 50%; background: transparent;
    color: var(--text-3); cursor: pointer;
    transition: color .2s, background .2s, transform .3s cubic-bezier(.2,.8,.2,1);
  }
  .bell:active { transform: scale(.88); }
  .bell.on { color: var(--blue); background: rgba(10,132,255,.12); }

  .card h3 {
    margin: 0 0 6px; font-size: 17px; font-weight: 600;
    letter-spacing: -.025em; line-height: 1.3;
  }
  .meta {
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    font-size: 13px; color: var(--text-2); line-height: 1.5;
  }
  .meta span { display: inline-flex; align-items: center; gap: 4px; }
  .meta svg { flex: 0 0 auto; opacity: .8; }

  .empty {
    text-align: center; color: var(--text-2);
    padding: 64px 20px; font-size: 15px; line-height: 1.6;
  }
  .empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }

  .footnote {
    text-align: center; color: var(--text-3);
    font-size: 12px; padding: 8px 0 0;
  }

  .backdrop {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
    background: rgba(0,0,0,.28);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    width: min(560px, 100%);
    max-height: 86vh; overflow-y: auto;
    background: var(--card);
    border-radius: 24px 24px 0 0;
    padding: 8px 22px calc(28px + env(safe-area-inset-bottom));
    transform: translateY(30px) scale(.98); opacity: 0;
    transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
    box-shadow: 0 -8px 40px rgba(0,0,0,.18);
  }
  .backdrop.show .sheet { transform: none; opacity: 1; }
  .grabber {
    width: 36px; height: 5px; border-radius: 3px;
    background: var(--text-3); margin: 6px auto 18px;
  }
  .sheet h2 {
    margin: 0 0 6px; font-size: 24px; font-weight: 700;
    letter-spacing: -.035em; line-height: 1.2;
  }
  .sheet .chip { margin-bottom: 16px; }
  .sheet p.summary {
    margin: 0 0 18px; color: var(--text-2);
    font-size: 15px; line-height: 1.55;
  }
  .rows { border-top: .5px solid var(--sep); margin-bottom: 20px; }
  .row {
    display: flex; justify-content: space-between; gap: 16px;
    padding: 12px 0; border-bottom: .5px solid var(--sep);
    font-size: 15px;
  }
  .row dt { color: var(--text-2); flex: 0 0 auto; }
  .row dd { margin: 0; text-align: right; font-weight: 500; }
  .row dd a { color: var(--blue); text-decoration: none; }

  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    min-height: 50px; border: 0; border-radius: 14px;
    font: inherit; font-size: 17px; font-weight: 600;
    text-decoration: none; cursor: pointer;
    transition: transform .3s cubic-bezier(.2,.8,.2,1), opacity .2s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-secondary { background: var(--fill); color: var(--text); }
  .btn:disabled { opacity: .45; cursor: default; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
  }

  @media (min-width: 600px) {
    .large-title { font-size: 40px; }
    .backdrop { align-items: center; }
    .sheet { border-radius: 24px; transform: translateY(16px) scale(.96); }
  }
</style>
</head>
<body>

<header class="nav" id="nav">
  <div class="nav-title">MyCSD</div>
</header>

<main class="wrap">
  <h1 class="large-title">Upcoming</h1>
  <p class="subtitle" id="subtitle">Loading…</p>

  <div class="segmented" id="segmented" role="tablist" aria-label="Filter">
    <div class="seg-thumb" id="segThumb"></div>
    <button class="seg" role="tab" data-filter="all" aria-selected="true">All</button>
    <button class="seg" role="tab" data-filter="online_talk" aria-selected="false">Talks</button>
    <button class="seg" role="tab" data-filter="quiz" aria-selected="false">Quizzes</button>
  </div>

  <div id="list"></div>
  <p class="footnote" id="footnote"></p>
</main>

<div class="backdrop" id="backdrop" aria-hidden="true">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="grabber"></div>
    <span class="chip" id="sheetChip">Talk</span>
    <h2 id="sheetTitle">—</h2>
    <p class="summary" id="sheetSummary"></p>
    <dl class="rows" id="sheetRows"></dl>
    <div class="actions">
      <a class="btn btn-primary" id="sheetLink" href="#" target="_blank" rel="noopener">Register</a>
      <button class="btn btn-secondary" id="sheetRemind" type="button">Remind me</button>
      <button class="btn btn-secondary" id="sheetClose" type="button">Close</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const DEMO = {
    generated_at: new Date().toISOString(),
    timezone: "Asia/Kuala_Lumpur",
    events: [
      { id: 1, kind: "event", category: "online_talk", title: "Rescue Ready: First Aid Basics",
        start_date: iso(new Date()), end_date: null, deadline: null, time_text: "8:00 PM - 9:30 PM",
        location: "Webex", fee: "RM2", register_by: null, link: "https://example.com/register",
        summary: "A beginner-friendly first aid webinar.", posted_at: null, status: "dated" },
      { id: 2, kind: "event", category: "quiz", title: "Python Basics Quiz",
        start_date: iso(addDays(new Date(), 2)), end_date: null, deadline: iso(addDays(new Date(), 2)),
        time_text: null, location: "Online", fee: null, register_by: null, link: null,
        summary: "Open-book quiz on Python fundamentals.", posted_at: null, status: "open" }
    ]
  };

  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function iso(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }

  let events = [];
  let filter = "all";
  let activeId = null;

  const el = {
    nav: document.getElementById("nav"),
    subtitle: document.getElementById("subtitle"),
    segmented: document.getElementById("segmented"),
    thumb: document.getElementById("segThumb"),
    list: document.getElementById("list"),
    footnote: document.getElementById("footnote"),
    backdrop: document.getElementById("backdrop"),
    sheetChip: document.getElementById("sheetChip"),
    sheetTitle: document.getElementById("sheetTitle"),
    sheetSummary: document.getElementById("sheetSummary"),
    sheetRows: document.getElementById("sheetRows"),
    sheetLink: document.getElementById("sheetLink"),
    sheetRemind: document.getElementById("sheetRemind"),
    sheetClose: document.getElementById("sheetClose"),
  };

  const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  function parseDate(s) {
    if (!s) return null;
    const [y, m, d] = s.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function today0() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function daysUntil(s) {
    const d = parseDate(s); if (!d) return null;
    return Math.round((d - today0()) / 86400000);
  }
  function fmtDate(s) {
    const d = parseDate(s); if (!d) return "Date TBA";
    return `${WD[d.getDay()]}, ${d.getDate()} ${MO[d.getMonth()]}`;
  }
  function dayKey(ev) { return ev.start_date || ev.deadline || ""; }

  function parseTime(text) {
    if (!text) return null;
    const m = text.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|a\.?m\.?|p\.?m\.?)?/i);
    if (!m) return null;
    let h = parseInt(m[1], 10);
    const min = m[2] ? parseInt(m[2], 10) : 0;
    const suf = (m[3] || "").toLowerCase().replace(/\./g, "");
    if (h > 23 || min > 59) return null;
    if (suf === "pm" && h < 12) h += 12;
    if (suf === "am" && h === 12) h = 0;
    if (!suf && h < 12) return null;
    return { h, m: min };
  }
  function startTime(ev) {
    if (!ev.start_date) return null;
    const t = parseTime(ev.time_text);
    if (!t) return null;
    const [y, m, d] = ev.start_date.split("-").map(Number);
    return new Date(y, m - 1, d, t.h, t.m);
  }

  const REMIND_KEY = "mycsd.reminders";
  const FIRED_KEY = "mycsd.fired";
  const WINDOW_MS = 15 * 60 * 1000;

  const reminders = () => new Set(JSON.parse(localStorage.getItem(REMIND_KEY) || "[]"));
  const setReminders = (s) => localStorage.setItem(REMIND_KEY, JSON.stringify([...s]));
  const fired = () => new Set(JSON.parse(localStorage.getItem(FIRED_KEY) || "[]"));
  const setFired = (s) => localStorage.setItem(FIRED_KEY, JSON.stringify([...s]));

  async function toggleReminder(id) {
    const set = reminders();
    if (set.has(id)) {
      set.delete(id);
      setReminders(set);
      return false;
    }
    if (!("Notification" in window)) {
      alert("This browser does not support notifications.");
      return false;
    }
    if (Notification.permission !== "granted") {
      const p = await Notification.requestPermission();
      if (p !== "granted") return false;
    }
    set.add(id);
    setReminders(set);
    return true;
  }

  function checkReminders() {
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    const on = reminders();
    if (!on.size) return;
    const done = fired();
    const now = Date.now();
    let changed = false;

    for (const ev of events) {
      if (!on.has(ev.id) || done.has(ev.id)) continue;
      const t = startTime(ev);
      if (!t) continue;
      const diff = t.getTime() - now;
      if (diff > 0 && diff <= WINDOW_MS) {
        new Notification("Starting soon", {
          body: `${ev.title}${ev.location ? " · " + ev.location : ""}`,
          tag: `mycsd-${ev.id}`,
        });
        done.add(ev.id);
        changed = true;
      }
    }
    if (changed) setFired(done);
  }

  const ICON = {
    clock: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    pin: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    money: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="6" width="18" height="12" rx="3"/><circle cx="12" cy="12" r="2.5"/></svg>',
    bell: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>',
    bellOn: '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a6 6 0 0 0-6 6c0 7-3 9-3 9h18s-3-2-3-9a6 6 0 0 0-6-6Z"/><path d="M13.7 21a2 2 0 0 1-3.4 0Z"/></svg>',
  };

  function chipFor(ev) {
    const days = daysUntil(ev.start_date || ev.deadline);
    if (days === null) return "";
    if (days === 0) return '<span class="chip today">Today</span>';
    if (days === 1) return '<span class="chip tomorrow">Tomorrow</span>';
    if (days > 1 && days <= 7) return `<span class="chip soon">In ${days} days</span>`;
    return "";
  }

  function closingChip(ev) {
    if (!ev.register_by) return "";
    const d = daysUntil(ev.register_by);
    if (d === null || d < 0 || d > 3) return "";
    const label = d === 0 ? "Closes today" : d === 1 ? "Closes tomorrow" : `Closes in ${d} days`;
    return `<span class="chip closing">${label}</span>`;
  }

  function metaLine(ev) {
    const parts = [];
    if (ev.time_text) parts.push(`<span>${ICON.clock}${esc(ev.time_text)}</span>`);
    if (ev.location) parts.push(`<span>${ICON.pin}${esc(ev.location)}</span>`);
    if (ev.fee) parts.push(`<span>${ICON.money}${esc(ev.fee)}</span>`);
    return parts.length ? `<div class="meta">${parts.join("")}</div>` : "";
  }

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function visibleEvents() {
    return events.filter(ev => filter === "all" || ev.category === filter);
  }

  function render() {
    const list = visibleEvents();
    if (!list.length) {
      el.list.innerHTML = `<div class="empty"><strong>Nothing here yet</strong>New posts will appear after the next bot sync.</div>`;
      el.footnote.textContent = "";
      return;
    }

    const groups = new Map();
    for (const ev of list) {
      const key = dayKey(ev) || "tba";
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(ev);
    }

    const today = today0();
    const html = [];
    let idx = 0;
    for (const [key, items] of groups) {
      const d = parseDate(key);
      const isToday = d && d.getTime() === today.getTime();
      let header;
      if (!key || key === "tba") header = "Date to be announced";
      else if (isToday) header = `<span class="today-dot"></span>Today · ${fmtDate(key)}`;
      else header = fmtDate(key);

      html.push(`<section class="day-group"><h2 class="day-header">${header}</h2>`);
      for (const ev of items) {
        const on = reminders().has(ev.id);
        html.push(`
          <article class="card" tabindex="0" role="button" data-id="${ev.id}"
            aria-label="${esc(ev.title)}" style="animation-delay:${Math.min(idx++ * 35, 280)}ms">
            <div class="card-top">
              <div>${chipFor(ev)} ${closingChip(ev)}</div>
              <button class="bell ${on ? "on" : ""}" type="button" data-bell="${ev.id}"
                aria-label="${on ? "Disable reminder" : "Enable reminder"}" aria-pressed="${on}">
                ${on ? ICON.bellOn : ICON.bell}
              </button>
            </div>
            <h3>${esc(ev.title)}</h3>
            ${metaLine(ev)}
          </article>`);
      }
      html.push("</section>");
    }

    el.list.innerHTML = html.join("");

    el.list.querySelectorAll(".card").forEach(card => {
      const open = () => openSheet(Number(card.dataset.id));
      card.addEventListener("click", open);
      card.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
    });

    el.list.querySelectorAll(".bell").forEach(btn => {
      btn.addEventListener("click", async e => {
        e.stopPropagation();
        const id = Number(btn.dataset.bell);
        const on = await toggleReminder(id);
        btn.classList.toggle("on", on);
        btn.setAttribute("aria-pressed", String(on));
        btn.innerHTML = on ? ICON.bellOn : ICON.bell;
      });
    });
  }

  function openSheet(id) {
    const ev = events.find(x => x.id === id);
    if (!ev) return;
    activeId = id;

    el.sheetChip.textContent = ev.category === "quiz" ? "Quiz"
      : ev.category === "online_talk" ? "Online talk"
      : ev.category === "in_person" ? "In person" : "Event";
    el.sheetTitle.textContent = ev.title;
    el.sheetSummary.textContent = ev.summary || "";
    el.sheetSummary.style.display = ev.summary ? "" : "none";

    const rows = [];
    if (ev.start_date) rows.push(["Date", fmtDate(ev.start_date)]);
    if (ev.time_text) rows.push(["Time", ev.time_text]);
    if (ev.location) rows.push(["Location", ev.location]);
    if (ev.fee) rows.push(["Fee", ev.fee]);
    if (ev.register_by) rows.push(["Register by", fmtDate(ev.register_by)]);
    el.sheetRows.innerHTML = rows.map(([k, v]) =>
      `<div class="row"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
    el.sheetRows.style.display = rows.length ? "" : "none";

    if (ev.link) {
      el.sheetLink.href = ev.link;
      el.sheetLink.style.display = "";
      el.sheetLink.textContent = ev.link.includes("form") ? "Open registration" : "Open link";
    } else {
      el.sheetLink.style.display = "none";
    }

    const on = reminders().has(ev.id);
    el.sheetRemind.textContent = on ? "Remove reminder" : "Remind me";
    el.sheetRemind.dataset.on = on ? "1" : "0";

    el.backdrop.classList.add("show");
    el.backdrop.setAttribute("aria-hidden", "false");
    document.body.classList.add("locked");
    el.sheetClose.focus();
  }

  function closeSheet() {
    el.backdrop.classList.remove("show");
    el.backdrop.setAttribute("aria-hidden", "true");
    document.body.classList.remove("locked");
    activeId = null;
  }

  el.sheetClose.addEventListener("click", closeSheet);
  el.backdrop.addEventListener("click", e => { if (e.target === el.backdrop) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && activeId !== null) closeSheet(); });

  el.sheetRemind.addEventListener("click", async () => {
    if (activeId === null) return;
    const on = await toggleReminder(activeId);
    el.sheetRemind.textContent = on ? "Remove reminder" : "Remind me";
    el.sheetRemind.dataset.on = on ? "1" : "0";
    render();
  });

  function moveThumb() {
    const active = el.segmented.querySelector('.seg[aria-selected="true"]');
    if (!active) return;
    el.thumb.style.width = active.offsetWidth + "px";
    el.thumb.style.transform = `translateX(${active.offsetLeft - 2}px)`;
  }

  el.segmented.addEventListener("click", e => {
    const btn = e.target.closest(".seg");
    if (!btn) return;
    filter = btn.dataset.filter;
    el.segmented.querySelectorAll(".seg").forEach(b =>
      b.setAttribute("aria-selected", String(b === btn)));
    moveThumb();
    render();
  });
  window.addEventListener("resize", moveThumb);

  window.addEventListener("scroll", () => {
    el.nav.classList.toggle("scrolled", window.scrollY > 24);
  }, { passive: true });

  async function load() {
    let payload;
    try {
      const res = await fetch("events.json", { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      payload = await res.json();
    } catch (err) {
      console.warn("events.json not found, using demo data.", err);
      payload = DEMO;
      el.footnote.textContent = "Demo data — run the exporter and deploy to see real events.";
    }

    events = (payload.events || []).slice().sort((a, b) => {
      const ka = a.start_date || a.deadline || "9999";
      const kb = b.start_date || b.deadline || "9999";
      return ka.localeCompare(kb) || a.title.localeCompare(b.title);
    });

    const n = events.length;
    el.subtitle.textContent = n
      ? `${n} upcoming item${n === 1 ? "" : "s"} · synced ${payload.generated_at ? payload.generated_at.slice(0, 16).replace("T", " ") : "—"}`
      : "No upcoming items right now.";

    if (!el.footnote.textContent) {
      el.footnote.textContent = "Synced from the MyCSD Telegram bot · reminders work while this page is open";
    }

    render();
    requestAnimationFrame(moveThumb);
    checkReminders();
  }

  setInterval(checkReminders, 30000);
  load();
})();
</script>
</body>
</html>
